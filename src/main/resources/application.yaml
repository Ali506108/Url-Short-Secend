spring:
  application:
    name: url-shorter-service

  datasource:
    url: jdbc:postgresql://localhost:5430/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      lettuce:
        pool:
          max-active: 100
          min-idle: 10
          max-idle: 20

      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81}

management:
  endpoints:
    web:
      exposure:
        include: "*"
server:
  port: 8674

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 10


